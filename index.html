dialog{width:min(92vw,460px);border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:12px 16px;font-family:var(--f)}dialog::backdrop{background:rgba(0,0,0,.55)}

میں کھویا رہتا ہے کسی پرائے معاملے میں دخل اندازی نہیں کرتا طبعاً نیک دل اور سخی  ہوتا ہے تنہائی پسند ہوتا ہے میلوں ٹھیلوں سے نفرت کرتا ہے زیادہ لوگوں میں اپنے آپ کو گھرا ہوا محسوس کرتا ہے تو بھاگ جانے کی راہیں تلاش کرتا ہے کسی سے لڑائی جھگڑے کو پسند نہیں کرتا کنی کترا کر نکل جاتا ہے اگر اس کا رخ روحانیت کی طرف ہوجائے تو کچھ بن جاتا ہے"}, "tahrik": {"عضلاتی مخاطی": "سرکی عضلاتی بافت میں سوزش کی وجہ سے نیند کی کمی کانوں میں خشکی کی وجہ سے کان بجنا مختلف قسم کی آوازیں آنا زبان پھٹنا خشک کھانسی خشک دمہ جس میں گاڑھا لیس دار مواد بدقت تمام تھوڑی تھوڑی مقدار میں سیاہی مائل سبز گھسیٹ کر نکالا جائے کبھی کبھار اس کے ساتھ خون بھی خارج ہو جوڑوں کا پتھر کی طرح سخت ہو جانا گنٹھیا شریانوں کا سخت ہو جانا کولیسٹرول ٹرائیگلیسرائیڈ کی زیادتی گیس قبض شدید دوالی انورسما ہارٹ اٹیک خالص بواسیر بادی", "عضلاتی قشری": "سرکی عضلاتی بافت میں سوزش کے بعد ورم نیند کی کمی ہونٹ پھٹے ہوئے نکسیر کا عارضہ عام جسم میں شوخ سرخ رنگ کا خون بغیر تکلیف بہے  مقدار میں زیادہ ہو قبض شدید کبھی کبھی اس کے ساتھ خون کے دھبے پائے جاتے ہیں شریانوں کی سختی ہارٹ اٹیک گیس کولیسٹرول ٹرائیگلیسرائیڈ کی زیادتی منہ کا ذائقہ ترش پسینے کی بدبو ترش سرعت انزال کرم منی نہایت کم کثرت طمث رحم میں  سختی بواسیر خونی خون شوخ سرخ رنگ بغیر تکلیف مقدار زیادہ خونی مروڑ خشک خارش جلد سے چھلکے اترنا انتشار کی زیادتی احتلام بوجہ گیس سِل نفث الدم تبخیر معدہ سے آنکھوں کا اندر کو دھنس جانا مسوڑھے پھٹنا دانتوں سے خون آنا پائیوریا ناف ٹلنا جوڑوں کی خشکی علامات اس کی اٹھتے بیٹھتے کڑکڑاہٹ وجع المفاصل بغیر سوزش ورم ـ", "قشری عضلاتی": "سر درد دونوں کنپٹیوں کے مقام پر ساتھ تپکن بوجہ سوزش (تنگی ) شرائین قلب ، شرائین قلب کی تنگی کی وجہ سے دل پر ٹیس دماغ کی قشری بافت میں سوزش کی وجہ سے دورے پڑنا ایگزیما پیلے رنگ کی پیپ کا خون آمیز اخراج زکام گرم جلن دار مواد پتلا کیرہ ٹانسلز ناک کے غدود بڑھ جانا مری کی سوزش جلن و ورم کانوں میں درد ورم ساتھ ہی زرد پیپ کا اخراج پائیوریا بوجہ عدم صفائی اسنان خناق کھانسی (زرد بلغم  والی) اخراج بمشکل دمہ شعبی (برانکائی ٹس )دمہ قلبی (کارڈی اک استھیما ) بے چینی فم معدہ (معدہ کے منہ پر سوزش) معدہ و آنتوں کی سوزش و ورم السر پیٹ میں مروڑ قسم کے درد سوزش پتہ ، پتہ میں دُکھن کا احساس پتہ میں پتھریاں (پتھریوں کی وجہ جاننے کے لیے پڑھیں  علاج الامراض حصہ دوم ) قبض گیس جگر کا بوجہ سوزش بڑھ جانا جگر پر چربی ورم جگر بول و براز بدبودار سوزش گردہ ورم گردہ (نیف رائی ٹس)  سنگرہنی پتلے پاخانے بار بار مواد کم جریان احتلام بوجہ رقت  سرعت ذکاوت حِس ضُعف باہ شہوت زیادہ لیکن بوقت جماع رابطہ ختم مذی ودی پیشاب خونی (بوجہ سنگ گردہ)  پیچس خونی ساتھ آؤں ، کھانے کے فوراً بعد حاجت مگر نامکمل پیشاب جلن دار مقدار میں کم زرد اور بار بار بواسیر خونی زردی مائل پتلے خون کا اخراج مقام سرخ نیز جلن اور دکھن کا احساس مقعد پر بائیں طرف تیکھے منہ والے بواسیری مسّے سوزش قاذفین اور ورم غصہ کی زیادتی گھبراہٹ (بوجہ سوزش قلب و اکلیلی شرائین ) خون کا دباؤ زیادہ اٹھرا ( بوجہ سوزش قاذفین و رحم) کمر درد پستان ڈھیلے سیلان الرحم ہارمونز کی کمی بیشی سے بیضہ کی پیدائش کم جلن کف و پاء چنونےمتلی سے بڑھ کر قے صفراوی (مواد زرد یا سبزی مائل زرد ذائقہ کڑوا ) قے ہوجانے کے بعد طبیعت ہشاش بشاش فواق (ہچکی) منہ کا ذائقہ کڑوا لبلبہ کی خرابی سے بلڈ شوگر زکام جلن دار رنگ زرد جو جم کرسبز ہو جائے ـ", "قشری اعصابی": "رنگ چہرہ سفید پیچس زردی مائل سفید زکام سفید بغیر تکلیف دماغ کی قشری جھلیوں کی سوزش کانوں کی سوزش ساتھ درد ورم اور زردی مائل پیپ کا اخراج سوزش و خارش چشم ککرے درد شقیقہ دائیں طرف دانت پیلے ہوائی نالیوں کی سوزش سے دمہ بلغمی (بلغم سفید رنگ بکثرت اخراج ) گھبراہٹ سانس پھولنا جلن و ورم مری سوزش فم معدہ و امعاء السر معدہ ، سوزش گردہ ، ورم گردہ ، سوزش و ورم رحم و قاذفین حیض مقدار میں کم درد کے ساتھ ، جلن کے ساتھ استحاضہ سوزش حالبین کی وجہ سے تقطیرالبول جنگاسوں (کنج ران) میں سوزش و ورم خارش بدن کی چپ چپاہٹ زرد گاڑھے جلن دار مواد کا اخراج ، خصیوں پر خارش پر سے بھوسی اترنا ناخن کا بیٹھ جانا پاؤں کی انگلیوں کی درمیانی جگہ کا پک جانا پاؤں کے انگوٹھوں کے کوروں کا پک جانا اور زرد رنگ کی خون آمیز پیپ کا اخراج جسم پر تیکھے منہ والی جلن دار پھنسیاں چھپاکی سوزاک جلن اور پیپ کا اخراج عورتوں میں پستانوں کا کینسر پستانوں کا لٹک جانا  کمر درد (بوجہ سیلان الرحم)  ضُعف اشتہا کمئی بول یورک ایسڈ کا اخراج ، نقرس عرق النساء اختناق الرحم (باؤ گولا) کثرت اشتہا جنسی خاص طور پر سانولی عورتوں میں بواسیر زرد پیپ والی بھگندر وغیرہ اس مریض کی خاص علامات ہر وقت درد کمر کی شکایت ہے", "اعصابی قشری": "رطوبات کی زیادتی سے چکر آنا دورے پڑنا نیند کی زیادتی نسیان زکام جو پانی کی طرح بغیر بہے کانوں کا بغیر درد بہنا منہ کا ذائقہ پھیکا کمر درد مستقل جسم میں ہلکے کھچاؤ دار درد دمہ بلغمی بلغم سفید رال بہنا فشارالدم میں کمی ـ", "اعصابی مخاطی": "نسیان ناک سے پانی جیسی نیلگوں قدرے گاڑھی رطوبات کا بِلا تکلیف اخراج کان بہنا زبان پر سفید تہہ رال بہنا ضُعف ہضم اسہال کثرت بول عورتوں میں دودھ زیادہ کمر درد ہمہ وقت رہتا ہے ـ", "مخاطی اعصابی": "اول دل کا عارضہ بوجہ کولیسٹرول (ٹرائی گلیسرائیڈ) گرم اغذیہ کھانے سے بلڈ پریشر قوی اور ٹھنڈی اغذیہ کھانے سے بلڈ پریشر ضعیف رہتا ہے جسم پر بغیر درد گلٹیاں ہیضہ ملیریا یرقان اسود دمہ خالص کدو کیڑے ـ", "مخاطی عضلاتی": "دمہ خالص ملیریا کا آخری درجہ احساس کی کمی ضُعف بصر نزلہ بند گاڑھا مواد سبز رنگ جسم پر خنازیری گلٹیاں موہکے گوبھی کے پھول سے مشابہہ رسولیاں گلٹیاں بغیر درد ـ"}, "tahlil": {"عضلاتی مخاطی": "طحال کا اپنے حجم میں پھیل جانا طحال کا مقام گرم رہنا ضعف طحال سے خون کے سرخ جسیموں کی کمی  قوت جاذبہ کمزور جسم پر بغیر درد گلٹیاں گوبھی کے پھول کے مشابہ موہکے پراسٹیٹ گلینڈ بڑھ کر پیشاب کا بند ہوجانا", "عضلاتی قشری": "طحال کا پھیل جانا ( بوجہ کثرت صفراء ) ساتھ ہلکا درد غدد لمفاویہ کا سوزش زدہ ہونا عروق طحال میں سدے", "قشری عضلاتی": "قلب کا پھیل جانا خون کا دباؤ نیچے کا زیادہ اوپر کا کم سانس پھولنا عضلات میں درد خصوصاً پنڈلیوں میں تحلیل کی وجہ سے دل کی کیواڑیاں بند نبضہ مس مقام قلب پر بوجھ اور گرمی کا احساس عضو خاص ڈھیلا کانچ نکلنا نتوءالرحم اعضاء شکنی وغیرہ ـ", "قشری اعصابی": "ضعف قلب خون کا دباؤ کم جسم کے عضلات میں درد خاص کر ٹانگوں کے نچلے حصوں میں جسے دبوانے سے آرام آئے جوڑوں میں درد اور آماس کارڈی اک اوڈیما ( تہیج)  شوگر خالص کثرت بول بوجہ ضعف گردہ و مثانہ پاؤں کے تلووں اور ایڑیوں میں درد ضعف بصر اور شانوں پر بوجھ کا احساس جریان لیکوریا شدید بدبودار اخراج ـ", "اعصابی قشری": "ضعف جگر بُھس (خون کی کمی ) جگر کا بوجہ تحلیل بڑھ جانا کمئی صفراء دیدان امعاء (کیچوے ) آتشکی پھنسیاں مقام جگر گرم ـ", "اعصابی مخاطی": "کمئی خون و صفراء پنڈلیوں میں اینٹھن والے درد ہاتھ پاؤں کے پورے نیلے ناخن نیلگوں سفید ہونٹ نیلے دمہ بلغمی لیس دار بلغم ملیریا کی ابتداء", "مخاطی اعصابی": "تحلیل دماغ سے نسیان بہرہ پن نزلہ بند آنکھوں سے پانی بہنا بوجہ ضعف دماغ آنکھوں میں سفید رنگ کی کیچ آنا ضعف ہضم وجع المفاصل جگر کے کینسر کا ابتدائی درجہ ـ", "مخاطی عضلاتی": "ضعف دماغ دے نسیان پٹھے درد احساس کی کمی ضعف بصر نزلہ بند سبز رنگ کی بلغم لکنت بالوں کا سفید ہو جانا درد شقیقہ بوجہ ضعف ہضم عورتوں میں بندش حیض ، رحم کی رسولیاں (فائبرائیڈ ) بواسیر بادی کا ابتدائی درجہ ـ"}, "taskeen": {"عضلاتی مخاطی": "سرسام نسیان پٹھوں میں کھنچاؤ دار درد گاڑھا لیسدار بند نزلہ جو بلغم بمشکل اخراج پائے سر کے پچھلے حصے میں بوجھ اور درد", "عضلاتی قشری": "دماغ و اعصاب میں سکون پٹھوں میں کھچاؤ دار درد ، درد کمر حرکت سے کمی ـ", "قشری عضلاتی": "طحال میں سردی سے سُدّہ عظم طحال ( رطوبات کی وجہ سے پھولنا)  وجع الطحال سرخ جسیمے کم خون کی کمی لمفیٹک اوڈیما ـ", "قشری اعصابی": "سکون غدد جاذبہ کی وجہ سے جسم پر اندرون جلد گلٹیاں جن کو دبانے سے معمولی درد کا احساس (یہ درد اوپر کی بافتوں میں تناؤ کی وجہ سے ہے)  طحال کا پھول جانا مقام طحال سرد سکون طحال کی وجہ سے عروق طحال میں سُدے گردے اور مثانےمیں ریگ (ریت)  کا رکنا اور کبھی خارج ہوتے رہنا ـ", "اعصابی قشری": "دل کا پھول جانا دل کی قوت کمزور دل ڈوبنا بول بستری آتشک زوروں پر جریان منی سیلان الرحم عسر طمث کمئی انتشار اسہال زیادتی پیشاب قوت ماسکہ کمزور ـ", "اعصابی مخاطی": "دل ڈوبنا ہیضہ موتیا بند قے پانی جیسی بے رنگ منہ بھر کر منہ کا ذائقہ پھیکا خون کا دباؤ کم شہوت نہایت کم کمر درد ٹانگیں درد حیض بند ـ", "مخاطی اعصابی": "خون کی کمی بوجہ تسکین جگر خون کا گاڑھا ہو کر پرپرا پیدا ہونا ملیریا بوجہ تسکین جگر دل ڈوبنا بوجہ ٹرائی گلیسرائیڈز کا بڑھنا خون کا دباؤ نہایت کم ـ", "مخاطی عضلاتی": "ضعف ہضم و اشتہا مقام جگر سخت ، جگر کا کینسر کمئی صفراء خون کا دباؤ کم پتہ گردہ مثانہ میں پتھریاں حقیقی ہارٹ اٹیک انورسما دل کی کیواڑیاں بند بوجہ گاڑھے قسم کا کولیسٹرول کرم منی مردہ عورتوں میں سختی رحم ، رسولی رحم بغیر درد مقام رحم پر ایک خاص قسم کے دباؤ کا احساس ، کمر درد بوجہ تسکین گردہ ، تعفن گردہ ، گردوں کا گل جانا ـ"}, "takhdeer": {"عضلاتی مخاطی": "جگر کا کینسر خون کی کمی ملیریا بخار کا آخری درجہ کچھ لوگوں میں ردعمل کے طور پر اس درجہ میں صحت ہونا شروع ہوجاتی ہے ایسے شخص کا دفاعی نظام مضبوط ہوتا ہے بواسیر بادی ریاحی دردیں  تپ دق مقام جگر سخت بغیر درد گردے اور مثانے کی پتھریاں", "عضلاتی قشری": "جگر کا ورم اور کینسر مقام جگر سخت اور سرد غدد ناقلہ میں تخدیر سے پسینہ بند ، پسینہ بند ہونے کی وجہ سے خارش پھوڑے پھنسیاں عسرالبول وغیرہ ـ", "قشری عضلاتی": "تخدیر اعصاب سے پٹھوں میں درد نسیان بال گرنا بال قبل ازوقت سفید ہونا بالچر انزال کے وقت بے لذّتی بہرہ پن چلتے چلتے نبضہ مس ـ", "قشری اعصابی": "قبل از وقت بالوں کا گرنا اور سفید ہوجانا ضعف بصر موتیا کی علامات اونچا سنائی دینا دانت گرنا گردے مثانے اور پتہ کی پتھریاں بوجہ تخدیر ـ", "اعصابی قشری": "مقام طحال سرد صلابت طحال بوجہ تخدیر یرقان اسود کی ابتداء تخدیر کی وجہ سے عروق طحال میں سُدّہ ـ", "اعصابی مخاطی": "تخدیر کی وجہ سے عروق طحال میں سُدّہ سختی طحال ، طحال کا کینسر قوت جاذبہ کمزور ہیم کی شرح فی صد کم مقام طحال سرد ـ", "مخاطی اعصابی": "ٹانگوں میں شدید قسم کے تناؤ دار درد دل کا حملہ بوجہ غلظت خون دانت مضبوط قوت جاذبہ تیز قبض حیض بند باہ کم کرم منی زیادہ عسرطمث ـ", "مخاطی عضلاتی": "خون کا دباؤ کم جسم سرد تحجر مفاصل خشک خارش بغیر رطوبت و جلن بواسیر بادی ـ"}, "med": {"محرک": {"عضلاتی مخاطی": "", "عضلاتی قشری": "لونگ 2 گرام جاوتری ایک گرام پیس لیں  نصف سے ایک گرام دوا لونگ دارچینی کے قہوہ سے دن میں چار مرتبہ کھانے کے آدھاگھنٹہ بعد دیں ـ افعال:  عضلات کو مشینی طور پر تحریک دیتی ہے مقوی جگر ہے ریاح کو پیدا کرکے خارج کرتی ہے ملیریا بخار ٹانگوں کی درد کمر درد  بوجہ سردی نزلہ بارد  اسہال عصابہ اور ہیضے کو مفید ہے جب دل بوجہ کثرت رطوبات پھیل گیا ہو اور فشار الدم ضعیف کا عارضہ لاحق ہو چکا ہو تو یہ دوا آب حیات کا کام کرتی ہے راز کی بات یہ ہے کہ مغلظات کے بعد مقوی باہ ہے ـ نفع خاص:  ہیضہ کے لئے اکسیر کا درجہ رکھتی ہے ـ", "قشری عضلاتی": "اجوائن دیسی پیس کر رکھ لیں 3گرام دن میں تین مرتبہ کھانے کے آدھاگھنٹہ بعد اجوائن دیسی کے قہوہ سے دیں ـ افعال:  جگر کو کیمیاوی طریقے سے فعلاً تیز کرکے صفراء پیدا کرکےخون کے اندر روکتی ہے بہترین مقوی معدہ  و امعاء اور ہاضم ہے برابر وزن کالی مرچ ملا کر تین گرام خون کو پتلا کرکے شریانوں اور وریدوں میں سے گزارتی ہے سردی کے امراض کے لئے بالضد مفید ہے ملیریا بخار کو نفع بخش ہے ـ نفع خاص:  بہترین ہاضم اور مخرج ریاح ہے سردی کے بخاروں کو مفید ہے", "قشری اعصابی": "زنجبیل 50 گرام نوشادر ٹھیکری 30 گرام پیس کر کپڑ چھان کر لیں ایک گرام کھانے کے بعد تازہ پانی سے یا ادرک کے قہوے میں شہد ملا کر دن میں تین مرتبہ دیں ـ افعال:  جگر کو مشینی تحریک دے کر صفراء کو پیدا کر کے ساتھ ہی اس کا اخراج شروع کر دیتی ہے بہترین ہاضم ہے ریاح کا خاتمہ کرتی ہے موسمی بخاروں کو مفید ہے گاڑی سبز بلغم کو پتلا کرکے خارج کرتی ہے دمہ خالص کے لیے بہترین دوا ہے ٹرائی گلیسرائیڈ  کے لئے مفید ہے خون کو پتلا کر کے رگوں  میں سے گزرنے کے قابل بناتی ہے ـ نفع خاص:   ریاح کو ختم کرتی ہے مشتہی ہے", "اعصابی قشری": "ملٹھی پیس کر رکھ لیں ایک گرام سے تین گرام دوا نیم گرم دودھ سے کھانے کے آدھ گھنٹہ بعد دن میں تین مرتبہ دیں اگر اس میں برابر وزن چھلکا اسپغول ملا کر چھ گرام دوا گرم دودھ سے لی جائے تو آنتوں کی سوزش اتار کر باآسانی اجابت لانے والی دوا ہے ـ افعال:  خون کہیں سے بھی آ رہا ہو اسے بند کرتی ہے سینہ کو نرم کرتی ہے جلن بول جلن فم معدہ و مری کے لیے نہایت فائدہ مند ہے چھلکا والی دوا کی قشری بواسیر کے لیے مفید ہے  ـ نفع خاص  : خون بند کرتی ہے", "اعصابی مخاطی": "قلمی شورہ سو گرام ، صندل سفید پچاس گرام ، ان دونوں کو الگ الگ پیس کر ملالیں ایک سے تین گرام دوا دن میں تین دفعہ کھانے کے آدھاگھنٹہ بعد شربت بزوری بارد یا دودھ سوڈے سے دیں ایک کپ چائے میں دو گلاس تازہ پانی میں ملا کر بھی لے سکتے ہیں ـ افعال:  تمام قشری سوزشوں کو مفید ہے جلن بول چھپاکی یرکان زرد سوزاک سوزش گردہ مثانہ احتباس بول جلن کف و پاء کو مفید ہے ـ نفع خاص:  جلن بول اور سوزاک کے پہلے درجے میں نہایت فائدہ مند ہے ـ", "مخاطی اعصابی": "تخم ریحان ، موصلی سفید ، ہر دوا برابر وزن پیس لیں دو سے 3گرام نیم گرم دودھ کے ہمراہ کھانے سے ایک گھنٹہ قبل دن میں دوبار دیں ـ  افعال:  نہایت ہی مغلظ ہے جب قشری تحریک کی وجہ سے مادہ منویہ نہایت رقیق ہوگیا ہو تو یہ دوا نہایت فائدہ مند ہوتی ہے ـ نفع خاص:  رقت سرعت  کو بڑے بڑے قیمتی نسخوں سے بڑھ کر نہایت مفید ہے ـ", "مخاطی عضلاتی": "صندل سفید 50گرام کافور دس گرام الگ الگ پیس کر ملالیں زیرو نمبر کیپسول بھرلیں ایک کیپسول صبح ایک شام شربت بزوری بارد سے کھانے کے آدھاگھنٹہ بعد دیں ـ افعال : حرقتہ البول (پیشاب کی جلن)  سوزاک حاد (تازہ) خون کو کم کرتی ہے اور مصفیٰ خون ہے ـ نفع خاص:  سوزاک حاد کے لیے بہت مفید ہے ـ"}, "شدید محرک": {"عضلاتی مخاطی": "آملہ 100 گرام  بلگری 50 گرام دونوں ادویہ کو الگ الگ پیس کر ملا لیں ایک سے تین گرام کھانے کے آدھے گھنٹے بعد سادہ پتی کے قہوے میں لیموں نچوڑ کر یا شربت انجبار سے دیں ـ  افعال. عضلات کو کیماوی طریقے سے تحریک میں لا کر تمام اعصابی علامات کو بالضد طریقے سے دور کرتی ہے اور تمام مخاتی علامات کو بالجزب کے طریقے پر فائدہ کرتی ہے کیفیاتی طور پر جسم میں خشکی سردی کی علامات پیدا کرتی ہےـ فوائد. سلسل بول شوگر خالص جریان لیکوریا خسرہ چیچک لاکڑا کاکڑا دل ڈوبنے کو مفید ہے پیچس کو بالضد طریقے سے ختم کرتی ہے اگر آؤں  آرہی ہو تو دس گرام چھلکا اسبغول کے ساتھ دیں اسہال کے لیے دارچینی کے قہوہ کے ساتھ دیں ـ نفـــع خاص.  بالوں کی سیاہی کو دیر تک قائم رکھتا ہے", "عضلاتی قشری": "دارچینی 30 گرام لونگ 20 گرام جاوتری 10 گرام ،  سب ادویات پیس کر ملا لیں 2 گرام دوا دن میں تین مرتبہ کھانے کے آدھاگھنٹہ بعد قہوہ مذکورہ سے دیں ـ نفع خاص:  اعصابی نزلہ اور اعصابی دردوں کو نہایت تیزی سے فائدہ کرتی ہے ہیضہ کے لئے تیز بہدف دوا ہے اس مقصد کے لیے اجوائن دیسی اور پودینے کے قہوہ سے دیں", "قشری عضلاتی": "اجوائن دیسی 100گرام گندھک آملہ سار 50 گرام پیس کر ملالیں ایک تا تین گرام عمر کے مطابق دن میں تین دفعہ کھانے کے بعد تازہ پانی سے یا پودینہ اور ادرک کے قہوہ سے دیں ـ نفع خاص:  بواسیر خونی (عضلاتی )کو مفید ہے اگر اس میں ہموزن چھلکا ریٹھا پیس کر ملا لیا جائے تو نفع بڑھ جاتا ہے", "قشری اعصابی": "زنجبیل پچاس گرام نوشادر ٹھیکری تیس گرام فلفل سیاہ 10 گرام سب ادویہ کو پیس کر ملا لیں 1 تا 2 گرام دوا دن میں تین مرتبہ کھانے کے بعد تازہ پانی سے لے کر اوپر سے ادرک اور پودینہ کا قہوہ پلائیں ـ افعال:  مذکورہ بالا ہی ہیں لیکن دائمی ہے ـ نفع خاص:  دمہ خالص کے لئے نہایت مفید ہے اس مقصد کے لیے دودھ میں شہد ڈال کر استعمال کرایں خشک کھانسی کے لیے اس  کے ساتھ  تریاق 45  ایک ایک گولی دیتا ہوں جو کہ نہایت مفید و مجرب ہے", "اعصابی قشری": "ملٹھی اور سہاگہ سفید برابر وزن ملا کر پیس لیں ایک سے دو گرام دن میں چار مرتبہ دودھ گرم سے دیں ـ  افعال:  مذکورہ بالا علامات کے علاوہ دق و سِل کو مفید ہے ـ نفع خاص:  حابس دم  خون بند کرنے والی ہے جلن کہیں بھی ہو فی الفور مفید ہے", "اعصابی مخاطی": "قلمی شورہ سوگرام سوڈاخوردنی پچاس گرام جوکھار پچیس گرام سب ادویات الگ الگ پیس کر ملالیں ایک سے تین گرام دن میں تین مرتبہ کھانے کے آدھاگھنٹہ بعد شربت بزوری بارد یا کچی لسی سے دیں  افعال:  حرقتہ البول جلن بول  بندش بول سوزاک پتھری گردہ و مثانہ کے لئے نہایت مفید ہے ـ نفع خاص: حرقتہ البول کے لیے بدرجہ اتم مفید ہے پیشاب کھول کر لاتی ہے ـ", "مخاطی اعصابی": "تودری سفید 50گرام ، موصلی سفید 20گرام ملا کر پیس لیں 3 سے 5 گرام دودھ اور دہی کی لسی سے یا کیلے کے ملک شیک کے ہمراہ صبح شام قبل از غذا استعمال کرایں ـ افعال:  مادہ منویہ کثیرالمقدار پیدا کرتی ہے  اعلٰی درجہ کی مغلظ دوا ہے ـ نفع خاص:  رقت سرعت  کو بدرجہ غایت مفید ہے اگر مزید نفع حاصل کرنا مقصود ہو تو اس میں تین ماشہ شمع(افیون)ملانے سے ممسک بھی ہو جاتی ہے", "مخاطی عضلاتی": "صندل سفید 50گرام ریشہ خطمی سو گرام دونوں ادویات کو باریک پیس لیں ایک گرام سے تین گرام دوا لسی یا شربت بزوری بارد یا شربت گوند سے دیں ـ افعال : صفراوی جنسی امراض یعنی سرعت رقت جریان کو مفید ہے ـ نفع خاص:  جریان مذی جریان ودی دونوں کو مفید ہے ـ"}, "ملیّن": {"عضلاتی مخاطی": "آملہ 100 گرام  ہلیلہ سیاہ 100 گرام  حب الآس 50 گرام  انجبار 50 گرام  سب ادویہ کو پیس کر ملا لیں ایک سے تین گرام کھانے کے آدھا گھنٹہ بعد حسب اولٰی بدرقہ سےدیں ـ نفع خاص:  آنتوں کی قوت ماسکہ کو بڑھا کر ان میں سے لیس دار مادے کو جذب کرتی ہے پیچس اور آؤں آنے کو بدرجہ اتم مفید ہے", "عضلاتی قشری": "دارچینی 30 گرام لونگ 20 گرام جاوتری 10 گرام ، سب ادویات پیس کر ملا لیں عمر کے مطابق دوا نصف گرام سے ایک گرام دن میں تین مرتبہ کھانے کے آدھاگھنٹہ بعد قہوہ مذکورہ سے دیں ـ نفع خاص: ضعف باہ اور ملیریا بخار ٹانگوں کے درد کو از حد مفید ہے اس دوا کو خالی معدہ استعمال نہ کیا جائے", "قشری عضلاتی": "اجوائن دیسی ، گندھک آملہ سار ، بابچی،  سب برابر وزن پیس لیں ایک گرام سے دو گرام تک دن میں تین مرتبہ کھانے کے آدھاگھنٹہ بعد پانی سے دیں یا اجوائن پودینہ کے قہوے سے دیں ـ افعال:  تمام ریاحی امراض کو مفید ہے گلے سے اترتے ہی ریاح کا خاتمہ کر دیتی ہے قبض سخت مواد گٹھلیوں کی شکل میں بواسیر جس میں شوخ سرخ خون آئے اس بواسیر میں درد جلن کچھ نہیں ہوتی بواسیر بادی کثرت طمث عضلاتی پھوڑے جن میں سبز رنگ کا گاڑھا مواد خون آمیز خارج ہو خشک خارش تحجر المفاصل ریاح شکم  پاؤں کی انگلیاں لگ جانا  غرضیکہ تمام عضلاتی اور مخاطی  امراض کو مفید ہے ـ نفع خاص:  مولد صفرا ہے خشکی اور سردی کے تمام امراض میں مفید و مجرب ہے", "قشری اعصابی": "قشری اعصابی جدید: ملٹھی ہلدی سونف سب برابر وزن لے کر پیس لیں ایک سے تین گرام نیم گرم دودھ سے استعمال کرائیں ـ افعال:  تزابیت معدہ گلے کی قشری سوزش بلغمی کھانسی ناک کے غدود بڑھ جانا وغیرہ کو ازحد مفید ہے معدہ کے السر کے لیے اس کے ساتھ قروح معدہ نصف گرام صبح و شام نہار نیم گرم دودھ کے آدھے کپ کے ساتھ دیتا ہوں مجرب ہے ـ نفع خاص:  گلے کی قشری سوزش خواہ کسی بھی درجے میں ہو نیم گرم دودھ یا دودھ میں بنفشہ بہی دانہ ابال کر استعمال کرانے سے بہت تیزی سے سوزش دور کر کے سکون کا باعث بنتی ہے مطب پر سب سے زیادہ چلنے والا نسخہ ہے ـ اعصابی قشری ملیّن: زنجبیل 50 گرام نمک سیاہ 25 گرام فلفل سیاہ ایک گرام ریوند خطائی 40 گرام پودینہ خشک 40 گرام سب ادویہ کو اچھی طرح صاف کر کے پیس لیں ایک سے تین گرام دن میں چار بار تازہ پانی یا قہوہ مذکورہ سے استعمال کرائیں ـ افعال:  جگر کو مشینی تحریک دے کر صفراء پیدا کرکے جسم کی ضرورت کے مطابق استعمال کر کے فالتو کا اخراج کرتی ہے ـ مقوی دماغ ہے بہترین ہاضم ہے ـ بواسیری خون عضلاتی کو مفید ہے ضعف اشتہا کو مفید ہے  موسمی بخاروں کے لیے اعلی دوا ہے  عضلاتی احتلام کو مفید ہے وجع المفاصل عضلاتی کو مفید ہے مالیخولیا مراقی کے لئے نفع بخش ہے  چہرے کی سیاہی مائل کیلوں کے لیے نہایت نفع بخش ہے ـ نفع خاص: چہرے کے کیلوں کے لئے ازحد مفید و مجرب ہے اس مقصد کے لیے اعصابی مخاطی  ملیّن دو حصے اس میں شامل کر کے پانچ گرام دوا دن میں تین مرتبہ کھانے کے بعد پانی سے دیں یا عرق مکو  سے دیں ـ", "اعصابی قشری": "سہاگہ سفید سو گرام ملٹھی سو گرام ریوند خطائی 130 گرام سب ادویات پیس لیں  ایک سے دو سے تین گرام کھانے کے بعد دن میں تین مرتبہ نیم گرم دودھ سے دیں ـ افعال: مذکورہ بالا علامات کے علاوہ چھپاکی تقطیرالبول فم معدہ سے لے کر نیچے کی تمام قشری سوزشوں کو مفید ہے ـ نفع خاص:  تقطیرالبول اور السر معدہ کے لئے لاجواب دوا ہے ـ", "اعصابی مخاطی": "تخم کاسنی ایک کلو ، سوڈاخوردنی آدھا کلو اول الذکر دوا پیس کر ثانی الذکر کو چھان کر اس میں ملا لیں تین گرام دوا دن میں تین مرتبہ کھانے کے آدھاگھنٹہ بعد پانی سے دیں  افعال : سوزش جگر سے پیدا شدہ امراض یرقان اصفر جلن کف و پاء سوزاک سوزش گردہ و مثانہ کو بہت مفید ہے ـ نفع خاص:  سوزش جگر گردہ و مثانی کو نہایت مفید ہے جب قبض ہو تو یہ دوا دیں ـ  دیگر:  تخم کاسنی کلو کشنیز تخم خرفہ تخم کاہو گل نیلوفر  قلمی شورہ سب آدھا آدھا کلو گل گیسو دو سو پچاس گرام سب ادویات صاف کرکے اچھی طرح پیس لیں اور 5گرام دوا شربت بزوری بارد دودھ سوڈا کچی لسی سے تین مرتبہ دن میں کھانے کے بعد دیں ـ نفع خاص:  جگر کے جمیع حار امراض کیلئے نہایت مفید و مجرب ہے ہیپاٹائٹس کی خاص دوا ہے جلن بول چھپاکی درد گردہ سوزش گردہ کے لئے مخصوص دوا ہے معمول مطب ہے ـ", "مخاطی اعصابی": "تودری سرخ ، تودری سفید ، بہمن سرخ ، بہمن سفید ، موصلی سفید ، سب بیس بیس گرام تخم کاہو ، خرفہ سیاہ ، پچاس پچاس گرام کالا دانہ (عشق پیچہ) سو گرام سب ادویہ صاف کر کے پیس لیں دو گرام سے 3 گرام دوا تازہ پانی یا نیم گرم دودھ سے دیں ـ  دیگر:  تخم کاہو ، تخم خرفہ سیاہ،  تخم کاسنی،  گلو خشک،  سب برابر وزن پیس لیں 3گرام دوا تازہ پانی یا شربت بزوری بارد یا شربت گوند سے کھانے کے بعد تین مرتبہ دن میں دیں ـ افعال: رقت کی وجہ سے احتلام اور سرعت انزال کو مفید ہے فشارالدم قوی (قشری) کو آنتوں کی مزمن سوزش ذکاوت حس وغیرہ کو مفید ہے میں اسے قشری بواسیر میں بھی بے خطا استعمال کرتا ہوں لیکن اس کے ساتھ حب بندق بھی دی جاتی ہے فوراً فائدہ کرتی ہے ـ نفع خاص:  آنتوں کی پرانی سوزش کے لئے اعلی درجہ کی دوا ہے آنتوں پر گاڑھی لیس دار رطوبت پیدا کر کے ان کے پرانے زخموں کو ٹھیک کرتی ہے لیکن ایک بات یاد رہے کہ کسی بھی فشارالدم ضعیف اور ٹرائی گلیسرائیڈ کے مریض کو نہیں دینا ـ", "مخاطی عضلاتی": "ریشہ خطمی 200گرام نرملی سوختہ سو گرام کائپھل سو گرام صندل سفید پچاس گرام اجوائن خراسانی پچاس گرام سب ادویہ کو پیس لیں دو سے تین گرام دوا کھانے کے بعد قہوہ ریش برگد ( بوڑھ کی داڑھی) یا چنوں کے آب زلال سے دیں ـ افعال: سرعت رقت اور ذکاوت حس کے لیے اعلی دوا ہے ـ نفع خاص: مادہ منویہ کی حدت کم کر کے اس کے متعلقہ امراض کا قلع قمع کرتی ہے جو ذکاوت حس کسی دوا سے ٹھیک نہیں ہوتی وہاں یہ دوا بفضلہ تعالی بہترین کام کرتی ہے ـ دیگر ملیّن:  گیری ، پھٹکڑی ، سنگجراح ، سب پچاس پچاس گرام تخم دھتورہ سیاہ 20گرام سب ادویات پیس کر ملا لیں نصف سے ایک گرام کالی پتی کے قہوے یا بوڑھ کی داڑھی کے قہوے سے دیں ـ  افعال:  قشری خون آنے کو روکتی ہے سوزاک کے ساتھ پیپ آنے کو روکتی ہے اندمالی کے طور پر کام کرتی ہے اندرونی زخموں کو خشک کرتی ہے یہ دیسی ایماکسل ہے جس کا کوئی آفٹر ایفیکٹ نہیں جریان لیکوریا کو مفید ہے ـ  نفع خاص: سوزاک کی پیپ کو درست کرتی ہے لیکن پہلے اعصابی ادویات سے مادے کا اخراج کرلیں بعد میں یہ دوا دیں لیکن کب ــ  ؟     جب شفاف پانی آرہا ہو ـ"}, "مُسہل": {"عضلاتی مخاطی": "ایک ملین میں سے 10 گرام لے کر اس میں دس گرام ہریڑ جلاپہ شامل کردیں ایک گرام سے دو گرام تازہ پانی سے دیں ـ افعال:   بلغمی مادے کو آنتوں پر سے صاف کرتی ہے اور آنتوں کی قوت ماسکہ کو بڑھاتی ہے اگر اسے 2ملی گرام لے کر ملیّن ایک گرام میں شامل کر دیں تو اس کی قوت کو 10 گنا بڑھا دیتی ہے", "عضلاتی قشری": "ملین میں سے 60 گرام مصّبر 30 گرام شحم حنظل 30 گرام ملا کر پیس لیں اور زیرو نمبر کے کیپسول بھر لیں رات کو سوتے وقت دو کیپسول تازہ پانی سے دیں ـ نفع خاص:  مخاطی مادہ کو سفید سفید لچھوں کی شکل میں بذریعہ پاخانہ تھوڑا سا وٹ ڈال کر نکالتی ہے ملیریا بخار کا تریاق ہے", "قشری عضلاتی": "سو گرام ملّین 3 لے کر اس میں ایک گرام مغز جمالگوٹہ پیس کر ملالیں زیرو نمبر کا کیپسول بھر کر رکھ لیں ایک سے دو کیپسول تک تازہ پانی سے دیں جمالگوٹہ کو مدبر کرنے کی ضرورت نہیں ہے ـ نفع خاص:  ایک کیپسول قوت باہ کو خوب تحریک دیتا ہے لیکن کسے..؟  جس کی قوت سردی کی وجہ سےختم ہو گئی ہو", "قشری اعصابی": "سو گرام ملین میں دس گرام ریوند عصارہ پیس کر ملالیں زیرو نمبر کیپسول بھر کر رکھ لیں اور رات کو دوکیپسول تازہ پانی سے دیں اگر اس کے ساتھ چھلکا اسپغول ایک چمچ نیم گرم دودھ کے ساتھ دیا جائے تو پاخانے نہیں لگتے بلکہ صرف ایک ہی حاجت کھل کر ہوتی ہے ـ افعال: مذکورہ بالا ہیں اگر ساتھ قبض ہو تو اسے استعمال کریں بے ضرر مسہل ہے یرقان اصفر میں اسے کبھی نہ بھولیں اس سے آنتوں کے سدے کھل کر یرقان دور ہوگا ـ", "اعصابی قشری": "ملین میں سے پچاس گرام لے کر اس میں دس گرام ریوند عصارہ نہایت باریک پیس کر اچھی طرح ملا لیں ایک سے ڈیڑھ گرام رات کو سوتے وقت نیم گرم دودھ سے دیں ـ  افعال:  مذکورہ بالا علامات کے ساتھ جب قبض ہو تو اسے ہرگز نہ بھولیں ـ  نفع خاص:  کم سن لڑکیوں کو جب حیض درد کے ساتھ آئے تو ایام شروع ہونے سے تین روز پہلے ایام آنے تک روزانہ شام کو ایک کیپسول گرم دودھ سے کھلانا درد کو آدھے گھنٹے میں موقوف کرتی ہے اگر دو تین ماہ ایساہی کریں تو اعضاء مخصوصہ کی اندرونی سوزش اتار کر حیض کو درست کرنے والی دوا ہے یرقان اصفر کو نہایت مفید ہے ـ دیگر:  سہاگہ سفید50گرام سوڈا خوردنی 50گرام ریوندعصارہ 20 گرام سب ادویات پیس لیں زیرو نمبر کے ایک تا دو کیپسول نیم گرم دودھ سے دیں دواؤں  کے دو نمبر ہونے کی وجہ سے یہ مسہل نیا ترتیب دیا ہے اس کے بھی تذکرہ اولٰی کے علاوہ کئی اور فوائد ہیں بے ضرر ہے سب سے بڑا فائدہ یہ ہے کہ اس کے استعمال سے متلی نہیں ہوتی ورنہ تذکرہ اولٰی مسہل سے کئی مریضوں کو متلی سے بڑھ کر قے بھی ہو جاتی تھی اس کے افعال تیز کرنے کے لئے آپ ریوند عصارہ چالیس گرام کر سکتے ہیں اور مقدار خوراک 1 کیپسول ہوگی اگر کسی مریض کو زیادہ پاخانے آنے لگیں تو اس ایک کیپسول کے ساتھ ڈیڑھ چمچ چھلکا اسپغول دے دیا کریں اس طرح صرف ایک ہی پاخانہ کھل کر ہوگا ـ", "اعصابی مخاطی": "ملین میں سے پچاس گرام لے کر اس میں دس گرام سقمونیا ولائتی الگ پیس کر ملالیں ایک گرام رات کو تازہ پانی سے دیں ـ افعال:  صفراء کو خارج کرنے کیلئے اس سے بڑھ کر کوئی دوا نہ ہو گی ـ نفع خاص:  یرکان اصفر کے مریض کو ضرور استعمال کرائیں یہ دوا جگر سے لے کر آنتوں تک کے  سدد کو خارج کرکے یرقان جیسی علامات کو درست کرتی ہے ـ", "مخاطی اعصابی": "پچاس گرام دوا مذکورہ بالا میں دس گرام سقمونیا ولائتی الگ پیس کر ملا دیں ایک گرام سے دو گرام دوا رات کو سوتے وقت نیم گرم دودھ سے استعمال کرائیں بعد میں دانتوں کو اچھی طرح صاف کر لیں ـ افعال:  صفراوی امراض کے ساتھ  جب قبض ہو تو اسے نہ بھولیں ـ نفع خاص:  صفراء کو بذریعہ پاخانہ خارج کرتی ہے بالضد طریقہ سے جگر میں تسکین پیدا کرکے صفراء کی پیدائش کو روکتی ہے بلڈ پریشر کو لو اور بھوک بند کرتی ہے ـ", "مخاطی عضلاتی": "ملین اور ہریڑ جلاپہ برابر وزن پیس کر رکھ لیں ـ نفع خاص:  مذکورہ بالا علامات کے ساتھ اگر قبض ہو تو اس دوا کو مت بھولیں ـ"}, "اکسیر": {"عضلاتی مخاطی": "کشتہ شاخ مرجان درمکھن کشتہ ، صدف در عرق گلاب ، یشب صلایہ،  زہرمہرہ خطائی صلایہ،  کشتہ عقیق،  کشتہ قلعی در بھنگ شورہ،  سب دس دس گرام مغز کنول گٹہ 50 گرام طباشیر 50 گرام الائچی سفید 50گرام چینی 250گرام ، عرق گلاب ایک بوتل ، تمام کشتہ جات کو عرق گلاب میں خوب کھرل کریں اور باقی ادویہ الگ الگ پیس کر اچھی طرح ملا لیں نصف گرام خلوئے معدہ دن میں دو مرتبہ چوسائیں ـ طباشیر خالص نہیں ملتی اس میں پتہ نہیں کیا ملاتے ہیں اس لیے اب اس میں زہر مہرہ خطائی ڈال لیا کریں جس سے اس کے افعال و اثرات میں کوئی کمی نہیں آتی ـ افعال:  قلب و عضلات کو فورا تحریک میں لاتی ہے مفرح ہے بچوں کے سوکڑے میں سفوف صحت کے ہمرا باری باری دینامفید ہے خفقان القلب کے لئے  بدرجہ اتم مفید دوا ہے دمہ قلبی کے لیے H.67 میں پانچواں حصہ ملا کر کھلانا معمول مطب ہے ، نفع خاص:  صفراوی قے کے لئے سات عدد الائچی سفید کے قہوہ سے کھلانا بہت مفید ہے حاملہ کی قے کیلئے جوارش الائچی شربت بزوری بارد میں لیموں نچوڑ کر کھلانا فائدہ کرتی ہے جو صفراوی قے کسی دوا سے نہ روکے اس کے لئے ساتھ چھوٹی الائچی ایک کپ پانی میں قہوہ پکا کر دینے سے اکثر ایک ہی کپ سے فائدہ ہوجاتا ہے قوت مدافعت کو مضبوط کرتی ہے ـ دیگر:  کشتہ فولاد فروٹ والا 10گرام کشتہ چاندی آب لیموں والا 15 گرام ہلیلہ سیاہ 10 گرام کشتہ جات کو آب آملہ مقطر یا عرق کیوڑہ میں چار گھنٹے کھرل کریں آخر میں لعاب بہی دانہ یا گوند ببول شامل کر کے نخود قابلی برابر گولیاں بنالیں ایک گولی دن میں چار مرتبہ شربت انجبار میں لیموں نچوڑ کر استعمال کرائیں ـ افعال:  فوری اثر ہے مؤلد خون محرک قلب وعضلات ہے جریان سرعت لیکوریا کو مفید ہے", "عضلاتی قشری": "شنگرف دس گرام مالکنگنی 50گرام کچلہ مدبر 50 گرام لونگ 30 گرام سب ادویات الگ الگ پیس کر مویز کی مدد سے نخودی گولیاں بنالیں ایک سے دو گولیاں کھانے کے بعد لونگ دارچینی کے قہوہ سے دن میں تین مرتبہ دیں ـ نفع خاص:  حرارت غریزی کو قائم کرکے جسم کی گرتی ہوئی قوت کو بحال کرتی ہے", "قشری عضلاتی": "پارہ ایک حصہ ، گندھک آملہ سار سات حصہ ،  پارے کو شیشہ نمک میں کھرل کریں جب سیاہ ہوجائے تو پانی سے دھو کر نمک نکال دیں یہ عمل بار بار کریں جب پارہ چاندی کی طرح شفاف ہو جائے تو گندھک شامل کرکے خوب کھرل کریں کہ چمک نہ رہے اکثر طبیب اس کو کجلی کے نام سے جانتے ہیں دو تا چار چاول دن میں تین مرتبہ کھانے کے بعد اجوائن پودینے کے قہوے سے دیں  اس کو جس بھی دوسری دوا میں ملا دیں اس کی قوت کئی گناہ بڑھا دیتی ہے ـ افعال:  مذکورہ بالا ہی ہیں اگر اسے ویسلین سفید میں دسواں حصہ ملا کر جو پھوڑے پکتے نہیں ہیں ان پر روزانہ لگائیں تو تین چار روز میں پک جاتے ہیں جیسا کہ شوگر کے پھوڑے ـ نفع خاص:  خشک خارش کے لیے روغن سرشف میں ملا کر لگانے سے نہایت فائدہ ہوتا ہے اگر کسی کو بجلی کا جھٹکا لگ گیا ہو تو اسے دودھ کے ساتھ استعمال کرانے سے اس کی کھوئی ہوئی توانائی فوری بحال ہو جاتی ہے جذام تک کو مفید ہے اس مقصد کے لیے اس میں چار حصے کلونجی ملا کر ایک تا دو گرام دوا کھانے کے بعد تازہ پانی سے دیں", "قشری اعصابی": "ہڑتال ورقیہ دس گرام سرمہ ساں کرلیں اور یہ ادویہ الگ پیس کر اس میں اچھی طرح ملالیں زنجبیل 50 گرام الائچی خورد 25 گرام فلفل سیاہ 30گرام چینی 120 گرام نصف گرام دوا دودھ گرم سے دیں ـ افعال:  خونی پیچش مروڑ قشری کھانسی مخاطی اعصابی اور عضلاتی بخار بواسیر خونی اور کثرت طمث جو فائبرائڈ رسولیوں کی وجہ سے ہو کو نہایت مفید ہے ـ نفع خاص :  بواسیر خونی کیلئے ساتھ ایک ایک گولی حب بندق نیم گرم دودھ کے ساتھ استعمال کرائیں ـ", "اعصابی قشری": "حجرالیہود دس گرام نوشادر ٹھیکری 10 گرام الائچی خورد 10گرام کہر باءشمعی دس گرام چینی 50گرام سب ادویات کو سرمہ ساں کرکے محفوظ کرلیں ایک گرام دن میں چار دفعہ کھانے کے آدھا گھنٹہ بعد نیم گرم دودھ سے دیں ـ  افعال:  سوزش گردہ پتھری گردہ پتھری مثانہ جلن بول بواسیر خونی کیلئے نہایت اعلٰی دوا ہے ـ نفع خاص:  گردے مثانے کی پتھریوں کے لیے بہت مفید ہے ـ", "اعصابی مخاطی": "کشتہ مرجان مکھن والا ، برادہ چاندی یا ورق چاندی دونوں دس دس گرام لے کر کھرل کر لیں جب چمک ختم ہوجائے تو اس میں آب گلہر دس تولہ کھرل کے ذریعے جزب کریں قوام درست ہونے پر چونّی برابر ٹکیاں بنا کر خشک کرلیں اب ایک کوزہ گلی میں رکھیں اور ہوا سے بچا کر ڈیڑھ کلو اوپلوں کی آگ دیں سرد ہونے پر نکال لیں ہلکے سرمئی رنگ کا کشتہ برآمد ہوگا سرمہ ساں کرکے رکھ لیں دو تا چار چاول سردیوں میں نیم گرم دودھ سے اور گرمیوں میں دودھ سوڈے سے دیں ہے ـ افعال:  غلبہ صفراء کو فی الفور ختم کرتی ہے طحال و غدد جاذبہ کی مقوی دوا ہے اس لیے طحال کو قوت دے کر اس کے ضعف یا سکون سے متعلقہ تمام امراض کا خاتمہ ہونا شروع ہو جاتا ہے ـ نفع خاص:   دل کی گھبراہٹ اور بچوں کا قد بڑھانے کو مفید ہے", "مخاطی اعصابی": "کشتہ شاخ مرجان 500ملی گرام ایک چمچ مکھن سے صبح شام خالی معدہ دیں ـ  افعال: کیلشئیم کی کمی سے پیدا شدہ امراض کے لیے لاثانی دوا ہے ـ نفع خاص: بچوں کے قد بڑھانے مٹی کھانے کی عادت چھڑانے ٹوٹے ہوئے جوڑوں کے جوڑنے کے لیے اعلیٰ قسم کی دوا ہے یعنی جو ہڈی ٹوٹ جائے اور کسی دوا سے فائدہ نہ ہو اس دوا کے استعمال سے بفضلہ تعالی بہت جلد جوڑ لوہے کی طرح جڑ جاتا ہے", "مخاطی عضلاتی": "کشتہ عقیق ،  کشتہ قلعی ، کشتہ چاندی ،  الائچی خورد سب دس 10گرام طباشیر بانسی 30 گرام تمام ادویات پیس کر ملا لیں نصف گرام صبح شام خالی معدہ مربہ آملہ سے دیں ـ افعال : خفقان،جریان  لیکوریا سرعت رقت کے علاوہ مذکورہ بالا علامات میں امدادی دوا کے طور پر دے سکتے ہیں ـ نفع خاص:  خفقان (دھڑکہ) کے لئے نہایت بھروسے کی دوا ہے ـ"}, "تریاق": {"عضلاتی مخاطی": "آملہ 250 گرام سفوف کرکے اس میں 50 گرام تیزاب گندھک ولایتی تام چینی  یا پلاسٹک کے برتن میں ڈال کر آہنی سلائی کی مدد سے خوب ہلائیں دوا کالی رنگت اختیار کر جائے گی ایک رات پڑی رہنے دیں اگر دوا نرم ہو یعنی گولی باندھنے کے لائق نہ ہو تو اس میں آملہ کا سفوف اور ملا لیں درست ہونے پر نخودی  گولیاں بنائیں ایک گولی دن میں چار بار تازہ پانی سے دیں ـ نفع خاص:   جن لوگوں کو بس کے سفر میں قے ہو جاتی ہے ان کے لیے بہت مفید ہے مشتہی ہے بھوک لگانے والی ہے اور معدہ کے لیے اس میں برابر وزن سنگدانہ مرغ ملا کر تین گرام ہر کھانے کے بعد کھانا نہایت فائدہ مند ہے", "عضلاتی قشری": "لونگ سو گرام جاوتری 50 گرام پیس لیں اور اس کے اوپر 30 گرام تیزاب گندھک ڈال کر کسی آہنی سلائی سے ہلاتے رہیں جب سب کچھ یک جان ہو جائے تیار ہے نصف گرام دوا دارچینی کے قہوہ میں ایک چمچ سرکہ ملا کر دیں ـ نفع خاص:  پھیکی قے جو منہ بھر کر آئے ہیضے کی قے اور اسہال کو ازحد مفید ہے ملیریا بخار میں حفظ ماتقدم کے طور پر بھی استعمال کرسکتے ہیں اسی گروپ کی دی ہوئی دوا کی بہت مدد گار بھی ہے", "قشری عضلاتی": "اجوائن دیسی 200 گرام میں گندھک کا تیزاب 40 گرام کسی پلاسٹک کے برتن میں ڈال کر آہنی سلائی سے ہلاتے رہیں جب دوا خوب حل ہو جائے تو اس کا رنگ کالا ہو جائے گا تیار ہے ایک گرام دن میں تین مرتبہ لونگ دارچینی یا اجوائن پودینے کے قہوہ سے دیں ـ افعال:  مذکورہ بالا ہی ہیں لیکن ہیضہ کے لئے خصوصی طور پر مفید ہے", "قشری اعصابی": "ہڑتال ورقیہ دس گرام سرمہ ساں کرکے اس میں دس تولہ پیپلامول کپڑ چھان کیا ہوا سفوف  ملا دیں گرام دودھ میں شہد ملا کر دیں ـ افعال:  دمہ خالص  کے لیے نہایت مفید و مجرب ہے", "اعصابی قشری": "ریوند خطائی ، ملٹھی ،  سہاگہ سفید ہر ایک 50 گرام پیس کر اس میں دس گرام شیر مدار اچھی طرح ملا لیں نصف سے ایک گرام نیم گرم دودھ سے دن میں چار دفعہ کھانے کے بعد دیں ـ افعال:  خون آنے کو روکتی ہے سینے کی جلن پیشاب کی جلن کو مفید ہے عورتوں میں جب حیض بہت درد کے ساتھ آئے تو مفید ہے ایسٹروجن ہارمون بڑھاتا ہے تو رحم اور قاذفین کی قشری سوزش فوراً اتر جاتی ہے حیض صحیح آنے لگتا ہے اور عورت صاحب اولاد ہو جاتی ہے کئی سالوں سے بے خطا دوا کے اور شفاءبخش کے طور پر مستعمل ہے ـ نفع خاص:  تپ دق کے لیے واقعی تریاق ہے ـ دیگر: ملین میں سے 250گرام لے کر اس میں دس گرام شیر مدار ملا لیں تیار ہے ایک سے دو گرام تک نیم گرم دودھ سے تین مرتبہ دن میں بعد ازغذا دیں افعال : تذکرہ اولٰی کے علاوہ نزلہ حار کو بواسیر قشری جس میں جلن اور درد بہت ہو تو اس دوا سے بڑھ کر کوئی دوا نہ ہو گی ہمارے مطب پر یہ دوا ٹنوں کے حساب سے استعمال ہو چکی ہے لڑکوں اور لڑکیوں میں نو جوانی کے عالم کی قشری سوزشوں کے لئے لاثانی دوا ہے ـ", "اعصابی مخاطی": "چھلکا ریٹھا 50گرام کافور دس گرام دونوں ادویات کو عرق گلاب میں کھرل کرکے مرچ سیاہ کے برابر گولیاں بنالیں بوقت ضرورت ایک تا دو گولی کچی لسی یا شربت بزوری بارد سے دیں ـ نفع خاص: سانپ اور سنکھیا کے زہروں کا تریاق ہے", "مخاطی اعصابی": "لوبان کوڑیا دس گرام چینی دس گرام شمع (افیون) ایک گرام سب ادویہ الگ الگ پیس کر ملا لیں سات سو ملی گرام دوا نیم گرم دودھ سے دن میں دو مرتبہ کھانے سے ایک گھنٹہ پہلے یا ڈیڑھ گھنٹہ بعد دیں ـ افعال:  اعلی درجہ کی ممسک دوا ہے قشری مریضوں کے لیے کسی نعمت سے کم نہیں سرعت رقت شوگر خالص لیکوریا جریان سوزاک جس میں پیپ آرہی ہو کو نہایت مفید دوا ہے نفع خاص: ممسک بے نظیر ہے ـ", "مخاطی عضلاتی": "کشتہ چاندی ، کشتہ گئودنتی برابر وزن ملا لیں نصف گرام بوقت ضرورت شربت انجبار سے دیں  سرعت رقت جریان میں مفید ہے ـ"}}, "food": ["1.مٹر ـ لوبیا ـ ارہر ـ ہرا چھولیا ـ کالے چنے ـ کچنار ـ سبز مرچ ـ چنے پلاؤ ـ کوئی تُرشی ـ باجرے کی
